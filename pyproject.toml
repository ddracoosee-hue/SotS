[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sots"
version = "0.1.0"
description = "The Subject of the Self research and manuscript workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "typer",
    "textual",
    "rich",
    "httpx",
    "pyyaml",
    "python-dotenv",
    "trafilatura",
    "rapidfuzz",
    "python-docx",
    "pypdf",
    "tenacity",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "pyright"]

[project.scripts]
sots = "sots.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sots"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: real provider or external API tests (opt in)",
    "chaos: resilience and failure injection tests",
    "tui: terminal user interface tests",
]
addopts = "-m 'not live'"
