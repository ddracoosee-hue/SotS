# Persona Panel template set (20 §4.1). A diverse TEMPLATE set for the author to
# edit in the Persona Studio — never a final set. Neutral ids, no stereotyped names.
# HARD RULE: min_age 18, validated at load — no persona under 18.

reviewed: false
constraints:
  min_age: 18
  cohort_weights: {gen_z_adult: 0.60, millennial: 0.30, gen_x: 0.10}

personas:
  - id: p01
    name: "Persona 01"
    cohort: gen_z_adult
    age: 22
    life_stage: "final year of university, first-generation student, works part-time"
    region: "mid-size US city"
    background_notes: "Daughter of Mexican immigrants; Catholic upbringing, now questioning; close extended family"
    reading_habits: "reads nonfiction on the commute; discovers books via short video clips"
    need_for_cognition: high
    current_season: "anxious about the job market after graduation"
    skepticism: "distrusts influencer advice; checks sources"
    values: ["authenticity", "fairness", "independence"]
    what_would_make_them_close_the_book: "being lectured; vague claims"

  - id: p02
    name: "Persona 02"
    cohort: gen_z_adult
