# Task -> provider routing (04 §3 + team routing blocks). Every task key is unique.
# If a task's provider is not configured, fall back per fallback_order (04 §3);
# verify.* tasks that fall back to local are capped at MOSTLY_TRUE (04 §3, 06 VR-GEN-07).

defaults:
  fallback_order: [muse, local]     # 04 §3

tasks:
  # --- Core pipeline (04 §3) ---
  summarize.chunk:        {provider: local, temperature: 0.0, max_output_tokens: 800}    # 04 §3
  segment.extract_units:  {provider: local, temperature: 0.0, max_output_tokens: 4000}   # 04 §3
  classify.unit:          {provider: local, temperature: 0.0, max_output_tokens: 600}    # 04 §3
  classify.safety_scan:   {provider: local, temperature: 0.0, max_output_tokens: 200}    # 04 §3, 01 R-PSY-04
  research.plan_queries:  {provider: muse,  temperature: 0.0, max_output_tokens: 800}    # 04 §3, 06 §3.1
  verify.researcher:      {provider: muse,  temperature: 0.0, max_output_tokens: 2000}   # 04 §3, 06 §4.1
  verify.skeptic:         {provider: muse,  temperature: 0.0, max_output_tokens: 1500}   # 04 §3, 06 §4.2
  verify.adjudicator:     {provider: muse,  temperature: 0.0, max_output_tokens: 1500}   # 04 §3, 06 §4.3
  media.identify:         {provider: local, temperature: 0.0, max_output_tokens: 300}    # 04 §3
  media.check:            {provider: muse,  temperature: 0.0, max_output_tokens: 2500}    # 04 §3
  psyche.emotion:         {provider: local, temperature: 0.2, max_output_tokens: 1500}   # 04 §3
  psyche.cognitive:       {provider: muse,  temperature: 0.2, max_output_tokens: 1500}   # 04 §3
  psyche.theme:           {provider: muse,  temperature: 0.2, max_output_tokens: 1500}   # 04 §3
  psyche.archetype:       {provider: muse,  temperature: 0.3, max_output_tokens: 1500}   # 04 §3
  psyche.blindspot:       {provider: muse,  temperature: 0.3, max_output_tokens: 1500}   # 04 §3
  psyche.reader:          {provider: muse,  temperature: 0.5, max_output_tokens: 1500}   # 04 §3
  psyche.synthesize:      {provider: muse,  temperature: 0.2, max_output_tokens: 2000}   # 04 §3
  narrative.map_messages: {provider: local, temperature: 0.0, max_output_tokens: 2000}   # 04 §3
  narrative.voice:        {provider: muse,  temperature: 0.2, max_output_tokens: 1200}   # 04 §3
  shadow.reflect:         {provider: muse,  temperature: 0.7, max_output_tokens: 3000}   # 04 §3, 10 §1
  shadow.grade:           {provider: muse,  temperature: 0.0, max_output_tokens: 2000}   # 04 §3, 10 §2

  # --- Fact-check specialists + scouts (06 §9; card names -> task keys) ---
  fact_check.triage:          {provider: local, temperature: 0.0, max_output_tokens: 1000}  # 06 §9 (triage.yaml)
  fact_check.stats:           {provider: muse,  temperature: 0.0, max_output_tokens: 2000}  # 06 §9 (stats.yaml)
  fact_check.courts:          {provider: muse,  temperature: 0.0, max_output_tokens: 2000}  # 06 §9 (courts.yaml)
  fact_check.academic:        {provider: muse,  temperature: 0.0, max_output_tokens: 2000}  # 06 §9 (academic.yaml)
  fact_check.social:          {provider: muse,  temperature: 0.0, max_output_tokens: 2000}  # 06 §9 (social.yaml)
  fact_check.quotes:          {provider: muse,  temperature: 0.0, max_output_tokens: 2000}  # 06 §9 (quotes.yaml)
  fact_check.discovery_scout: {provider: muse,  temperature: 0.3, max_output_tokens: 2500}  # 06 §9.3 (discovery_scout.yaml)
  fact_check.media_scout:     {provider: muse,  temperature: 0.4, max_output_tokens: 2500}  # 06 §9.3 (media_scout.yaml)

  # --- Expansion team (11 §6) ---
  expand.concepts:   {provider: local, temperature: 0.1, max_output_tokens: 2000}  # 11 §6
  expand.merge:      {provider: local, temperature: 0.0, max_output_tokens: 1000}  # 11 §6
  expand.link:       {provider: muse,  temperature: 0.4, max_output_tokens: 1500}  # 11 §6
