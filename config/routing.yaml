  rewrite.format_structure:    {provider: local, temperature: 0.0, max_output_tokens: 1500}  # 19 §7
  rewrite.line_edit:           {provider: muse,  temperature: 0.3, max_output_tokens: 3000}  # 19 §7
  rewrite.master:              {provider: muse,  temperature: 0.4, max_output_tokens: 6000}  # 19 §7
  rewrite.weave:               {provider: muse,  temperature: 0.5, max_output_tokens: 3000}  # 19 §7
  rewrite.style_guide:         {provider: muse,  temperature: 0.2, max_output_tokens: 2500}  # 19 §7
  rewrite.style_report:        {provider: muse,  temperature: 0.0, max_output_tokens: 2000}  # 19 §7
  rewrite.cross_check:         {provider: muse,  temperature: 0.0, max_output_tokens: 3000}  # 19 §7
  rewrite.entailment:          {provider: local, temperature: 0.0, max_output_tokens: 300}   # 19 §7, 19 §5.3

  # --- Audience lab + learning (20 §8) ---
  audience.mechanics_explain: {provider: local, temperature: 0.2, max_output_tokens: 2000}  # 20 §8
  audience.persona_read:      {provider: muse,  temperature: 0.8, max_output_tokens: 1500}  # 20 §8
  audience.takeaway_match:    {provider: local, temperature: 0.0, max_output_tokens: 200}   # 20 §8, 20 §5.1
  audience.brief:             {provider: muse,  temperature: 0.2, max_output_tokens: 2500}  # 20 §8
  learning.summarize:         {provider: local, temperature: 0.0, max_output_tokens: 1000}  # 20 §8

  # --- Legal chamber (22 §8) ---
  legal.screen:       {provider: local, temperature: 0.0, max_output_tokens: 1500}  # 22 §8, 22 §2
  legal.counsel:      {provider: muse,  temperature: 0.3, max_output_tokens: 3000}  # 22 §8 (all 8; card-specific prompts)
  legal.synthesize:   {provider: muse,  temperature: 0.1, max_output_tokens: 4000}  # 22 §8
  legal.entailment:   {provider: local, temperature: 0.0, max_output_tokens: 300}   # 22 §8, 22 §7

  # --- Quality gate judges (17 §4) ---
  grader.judge_a: {provider: muse,  temperature: 0.0, max_output_tokens: 2000}  # 17 §4 (judge_strict; A/B on different providers if possible)
  grader.judge_b: {provider: local, temperature: 0.0, max_output_tokens: 2000}  # 17 §4 (judge_reader)
  grader.judge_c: {provider: muse,  temperature: 0.0, max_output_tokens: 2000}  # 17 §4 (judge_tiebreak; median of A/B/C on >= 2pt splits)

  # --- Proposal desk (18 §4; no blueprint routing block, keys follow the desk workflow) ---
  proposals.draft: {provider: muse,  temperature: 0.4, max_output_tokens: 2500}  # 18 §1-§4 (pitch + placements + modes + questions)
  proposals.chat:  {provider: muse,  temperature: 0.6, max_output_tokens: 1500}  # 18 §4 (discuss step, Dialogist runtime)

  # --- Foundation (23) ---
  foundation.parse_brief: {provider: muse, temperature: 0.0, max_output_tokens: 8000}  # 23 §2 (brief md -> ChapterBrief)
  classify.block_map:     {provider: local, temperature: 0.0, max_output_tokens: 200}   # 23 §5 (unmarked text -> block/prompt)
