  expand.brief:      {provider: muse,  temperature: 0.3, max_output_tokens: 1500}  # 11 §6
  expand.queries:    {provider: muse,  temperature: 0.3, max_output_tokens: 600}   # 11 §6
  expand.read:       {provider: muse,  temperature: 0.0, max_output_tokens: 2500}  # 11 §6
  expand.report:     {provider: muse,  temperature: 0.2, max_output_tokens: 6000}  # 11 §6
  expand.dialogue:   {provider: muse,  temperature: 0.6, max_output_tokens: 2000}  # 11 §6
  expand.chat:       {provider: muse,  temperature: 0.6, max_output_tokens: 1500}  # 11 §6
